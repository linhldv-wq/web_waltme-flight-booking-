<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xác nhận đặt vé - SkyBook</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f7fb; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; text-align: center; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { color: #10b981; margin-bottom: 12px; }
        p { color: #4b5563; margin-bottom: 20px; }
        .btn { background: #3b82f6; color: white; padding: 12px 24px; border-radius: 10px; text-decoration: none; font-weight: 600; display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="statusTitle">Đang xử lý xuất vé...</h2>
        <p id="statusDesc">Vui lòng đợi trong giây lát khi hệ thống kết nối với hãng hàng không để xác nhận chỗ ngồi.</p>
        <div id="details"></div>
        <a href="index.html" class="btn" style="display:none; margin-top:20px;" id="homeBtn">Về trang chủ</a>
    </div>

    <script>
        async function verifyPayment() {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session_id');
            if (!sessionId) {
                document.getElementById('statusTitle').innerText = "Lỗi phiên giao dịch";
                document.getElementById('statusDesc').innerText = "Không tìm thấy mã phiên thanh toán.";
                return;
            }

            try {
                const res = await fetch('/api/verify-and-book', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('statusTitle').innerText = "🎉 Đặt vé thành công!";
                    document.getElementById('statusDesc').innerHTML = `Thanh toán qua thẻ thành công.<br>Mã đặt chỗ (Booking Reference) của bạn là: <strong style="color:#1e3a8a; font-size:1.2rem;">${data.booking_reference}</strong>`;
                } else {
                    document.getElementById('statusTitle').innerText = "Thanh toán thành công nhưng lỗi xuất vé";
                    document.getElementById('statusDesc').innerText = data.error;
                }
            } catch (e) {
                document.getElementById('statusTitle').innerText = "Lỗi hệ thống";
                document.getElementById('statusDesc').innerText = "Không thể kết nối đến máy chủ xác thực.";
            } finally {
                document.getElementById('homeBtn').style.display = 'inline-block';
            }
        }
        verifyPayment();
    </script>
</body>
</html>
